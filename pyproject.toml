[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa"
version = "1.1.0"
description = "MESA, Mars Elevation from Shading and Altimetry: an 18 m DEM of Mars from single CTX images"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "torch>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.4",
]

[project.optional-dependencies]
register = ["opencv-python-headless>=4.7"]
infill-train = ["lightning>=2.0"]

[tool.setuptools]
packages = ["mesa"]
